<!doctype html>

<head>

<style>
:root{--bg:#f5f4ef;--tx:#171714;--mu:#77756c;--ln:#dddbd1;--ac:#e5491a;--fg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

label{display:grid;gap:2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}

.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:16px 18px;text-align:left;margin-top:14px}.row svg{transform:rotate(180deg)}
.st{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln)}
.sg{display:flex}.sg button{background:none;border:1px solid var(--ln);padding:7px 12px;color:var(--mu);margin-left:-1px;font-size:13px}.sg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:var(--ln);position:relative}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:left .15s}.sw[aria-checked="true"]{background:var(--ac)}.sw[aria-checked="true"]::after{left:23px;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}#toast.on{opacity:1}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>'<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const MIME={mp4:'video/mp4',webm:'video/webm',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp'};
const MAXMB=Number((window.KLIPIN||{}).maxMB)||50,OK=new Set(Object.values(MIME)),MAX=MAXMB*1048576,ID=/^[a-z0-9]+$/;
let db=null,user=null,assets=null,uid=null,canEdit=false,canWrite=null,meRef=null,profRef=null,me=null;
let posts=[],pmap={},extra={},tried={},profs={},loaded=false,fin=false,tab='home',cur=null,built=null,pend=0,wq=Promise.resolve(),armed=null,pdirty=false,upv='public',uq=Promise.resolve();
const clean=o=>({saved:Array.isArray(o.saved)?o.saved.filter(x=>typeof x==='string'&&ID.test(x)).slice(-2000):[],theme:['auto','light','dark'].includes(o.theme)?o.theme:'auto',autoplay:o.autoplay!==false,vis:o.vis==='link'?'link':'public'});
const ls={get(){try{return JSON.parse(localStorage.getItem('klipin')||'null')}catch(e){return null}},set(v){try{localStorage.setItem('klipin',JSON.stringify(v))}catch(e){}}};
let S=clean(ls.get()||{});upv=S.vis;
const valid=p=>!!p&&ID.test(p.id||'')&&/^[0-9a-f-]{36}\/[0-9a-f]{32}$/.test(p.a||'')&&(p.k==='v'||p.k==='i')&&typeof p.t==='number';
const MEDIA=window.KLIPIN_MEDIA||'',src=p=>MEDIA+p.a,P=id=>pmap[id]||extra[id],vis=p=>!p.u||(!!uid&&p.o===uid);
const rel=t=>{const s=(Date.now()-t)/1000;if(s<45)return'baru saja';if(s<3600)return Math.max(1,Math.round(s/60))+' mnt lalu';if(s<86400)return Math.round(s/3600)+' jam lalu';if(s<604800)return Math.round(s/86400)+' hari lalu';return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};

const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.src=x.target.dataset.s;io.unobserve(x.target)}}),{rootMargin:'300px'}):null;

async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){}try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}

function mk(p){const a=document.createElement('article');a.className='it';a.dataset.id=p.id;

function upd(a,p){const g=s=>a.querySelector(s);g('.ti').textContent=p.ti||'Tanpa judul';const n=g('.nm');if(n.dataset.u!==(p.o||''))n.dataset.u=p.o||'';const t=g('.tm');t.dataset.t=p.t;t.textContent=rel(p.t);g('.tg').textContent=p.u?'Hanya link':'';const sv=S.saved.includes(p.id),b=g('[data-a=save]');b.classList.toggle('on',sv);b.lastChild.textContent=sv?'Tersimpan':'Simpan'}
function recon(box,arr){const ex={};[...box.children].forEach(c=>{ex[c.dataset.id]=c});const want=new Set(arr.map(p=>p.id));for(const k in ex)if(!want.has(k))ex[k].remove();

async function paintNames(){const ids=[...new Set($$('[data-u],[data-av]').map(e=>e.dataset.u||e.dataset.av).filter(Boolean))];let ps={};try{if(user&&ids.length)ps=(await user.profiles(ids))||{}}catch(e){}

$$('img[data-av]').forEach(e=>{const p=ps[e.dataset.av];if(p&&p.avatarUrl&&e.dataset.bad!==p.avatarUrl&&e.getAttribute('src')!==p.avatarUrl){e.onerror=()=>{e.dataset.bad=p.avatarUrl;e.removeAttribute('src')};e.src=p.avatarUrl}})}

if(built!==cur){built=cur;m.innerHTML=p.k==='v'?'<video src="'+src(p)+'" controls playsinline preload="metadata"></video>':'<img src="'+src(p)+'" alt="">';const v=m.querySelector('video');if(v&&S.autoplay)v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})}
const sv=S.saved.includes(p.id),own=!!(db&&uid&&(p.o===uid||canEdit)),ar=armed===p.id;
i.innerHTML='<h1 class="wt">'+esc(p.ti||'Tanpa judul')+'</h1><p class="mm"><img class="av" data-av="'+esc(p.o)+'" alt=""><span class="nm" data-u="'+esc(p.o)+'"></span><span>'+esc(rel(p.t))+'</span>'+(p.z>0?'<span>'+esc(sz(p.z))+'</span>':'')+(p.u?'<span>Hanya link</span>':'')+'</p>'+(p.ds?'<p class="ds">'+esc(p.ds)+'</p>':'')+
